[project]
name = "ifood-craving-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143",
    "httpx>=0.28.1",
    "mcp>=2.3",
    "python-dotenv>=1.2.4",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
