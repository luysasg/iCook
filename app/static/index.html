<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>iCook</title>
  <link rel="icon" href="/static/logo.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/static/logo.png" alt="" aria-hidden="true">
        <div>
          <h1>iCook</h1>
          <p class="brand-sub">da vontade pra cozinha</p>
        </div>
      </div>
      <div class="actions">
        <button id="reset" class="btn btn-ghost btn-small" type="button" aria-label="Começar uma nova conversa">Nova conversa</button>
      </div>
    </header>

    <main id="chat" class="chat" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversa"></main>

    <div id="auth-banner" class="auth-banner" role="status" hidden></div>

    <form id="composer" class="composer" autocomplete="off">
      <label for="input" class="sr-only">Mensagem</label>
      <input id="input" type="text" aria-label="Mensagem" maxlength="2000" enterkeyhint="send">
      <button id="send" class="send" type="submit" aria-label="Enviar mensagem">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
    </form>
  </div>

  <template id="typing-template">
    <div class="msg bot typing" aria-label="O assistente está trabalhando">
      <div class="bubble"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div class="status-line" role="status"></div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
